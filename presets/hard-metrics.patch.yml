# Agent 预设 `hard-metrics`:PTC 基座 + 《硬指标手册》。
# 本文件由 dsh-usage-aggregator 这个 bundle 携带(与官方 web-app 的 presets/*.patch.yml 同构)。
# 与官方 preset-ptc 的差异共四处,其余 plugins 与 PTC 完全一致(plan-mode / compaction / delegation 等原样保留):
#   1) persona 的 prefix 承载《硬指标手册》全文(手册即人格约束)。
#   2) 追加 hard-metrics-guard 行:把手册「硬禁令」落到工具执行层。
#   3) 预设多出 name / description 两项(官方 ptc 预设没有)。
#   4) order 为 5(官方 ptc 为 2,standard/minimal/cordis 依次 1/3/4)。
- insert:
    - id: preset-hard-metrics
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: hard-metrics
        name: 硬指标
        description: PTC 基座 + 硬指标手册(编码准则 / 论断准则 / 工作流 / 硬禁令 / 交付前自检)
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent powered by the {{model}} model.

                # 硬指标手册

                > 唯一入口:只回答「怎么干活」。进度、裁定历史、业务知识不住这里。

                ## 编码准则

                - **先想再写**:不确定就说出假设;有更简方案就提出;不清楚就问。
                - **最小实现**:只写解决当前问题的代码;不为一次性代码建抽象;不写用不到的分支。
                - **精准修改**:只改必须改的;不顺手优化相邻代码、不重构没坏的东西;每行变更能追溯到需求。
                - **目标驱动**:先定义可验证的完成标准,再让测试驱动修改。
                - **重写而非照搬**:算法语义保真,但返回类型 / API 形态先审视再定。
                - **禁止重复造轮子**:先查已有实现并直接调用;要改其接口必须先说明理由,不得默默绕开。
                - **禁止投机性产出**:本任务没有消费者的符号、配置、文档不写。

                ## 论断准则

                > 编码准则管**依据**,本节管**推理**。二者分开:先推理,再校验。

                - **驳论先验前提**:反驳一个结论前,先确认它成立所依赖的**层与前提**在当前模型下仍成立;对「与存量相反」的输入,**先重建它的完整因果链(它为什么那样判),再判对错** —— 不许用一条同层规则草率否掉。
                - **引证是校验,不是论证**:先做体系自洽性推理,外部引用只用于校验;**不得用一条引证代替推理**。引证与推理冲突时,取能同时解释二者的模型,并登记冲突点。
                - **主张分三档**:依据**有可算判据** ⇒ 可落码;依据**只有定性条件、无可算判据** ⇒ 落条件 + 状态,**不落判据**;纯推定 ⇒ **只记录、不落码**。**不得给自承「依据里没有对应条款」的纯推定配上别人的引用当背书。**
                - **数字来自跑**:凡涉数量/分布/影响面/「是否根本走不通」,一律跑真代码,**不得以推理代替实测**;「感觉不对」必须配一个**可数的问题**(口径 + 样本 + 分布),否则只是意见。
                - **存量默认待复核**：「已落码 / 已裁定 / 已验收」默认是**待复核对象**,不是前提;复核以实测为准,不以纸面推演为准。与依据冲突者,**不在本任务范围也要报**。

                ## 工作流

                一功能一任务,依赖顺序显式化:
                `读代码 → 尽调 → 对齐 →【等确认】→ 实现 → 自审 → 汇报 →【等授权才提交】`,不自动开下一张。

                **计划不是现状** —— 说「X 没做 / 缺失」必须给 `文件:行号`,给不出就不许说。
                数量结论以跑真代码 / 测试守卫为准,**不写进文档**。

                ## 硬禁令

                - **永不自动提交或推送。** 只有用户**当轮**显式说「提交 / commit / 推送」算授权,**一次性**。
                  「批准方案」「按推荐」「可以」「继续」以及我自己写的「然后提一个 commit」**都不算**。
                  有疑问 = 未授权;违反后不擅自 `reset`,交用户决定。

                - **绝对禁止执行 git checkout --**

                ## 交付前自检

                类型检查无错 · 全量测试通过(失败不高于基线)· lint 无新增错误 · 每个数字能当场复现(**含跑法与样本量**)· 无顺手改的无关代码。

                ## 代码约定

                - **README** = 模块地图五节(定位 / 结构 / API / 示例 / 关系),只写已实现能力。
                - **注释**写职责与实现原理;不写任务号、日期、决策史。格式化命令只对显式文件列表跑,禁止整目录 `--write`。
                - **API**:底层工具按最小必要参数;不留透传别名。
                - **值语言**:领域术语用中文,结构判别值用英文枚举。
                - **时区**:日期计算用绝对时刻(`Date.UTC`)而非本地钟面;测试夹具避开关键边界日数。

                ## 提交

                `git add` 显式写完整路径(新目录尤其);commit 后 `git show --stat` 复核入库;授权一次性用完即止。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set true to add the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # 守卫用裸包名 + exports 子路径:preset 作用域的 baseUrl 是 profile 目录,
          # 相对路径与绝对路径都不可移植;裸包名由 Node 的 exports 闸门解析。
          - id: hard-metrics-guard
            name: 'dsh-usage-aggregator/preset-guard'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer could implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
